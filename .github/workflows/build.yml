name: Build FOSS Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit public source
        run: python3 tools/audit_public_source.py
      - name: Prepare checksum-verified native inputs
        run: python3 tools/prepare_native.py
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build
        working-directory: V2rayNG
        run: ./gradlew :app:testFdroidDebugUnitTest :app:assembleFdroidDebug --no-daemon
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: pure-proxy-foss-debug
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
